<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3C49" />
    <title>Offline · Marea Alta Surf Bar</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(180deg, #FFB627 0%, #FF6B2C 45%, #D7263D 100%);
        color: #0B3C49; text-align: center;
      }
      main { max-width: 28rem; background: #FFF6E8; border-radius: 1.5rem; padding: 2rem 1.5rem; }
      h1 { font-size: 1.6rem; margin-bottom: .75rem; }
      p { line-height: 1.55; color: #4a4038; }
      button {
        margin-top: 1.5rem; border: none; border-radius: 999px; padding: .8rem 1.5rem;
        background: #0B3C49; color: #FFF6E8; font: inherit; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>The last schedule and menu you opened may still be available. Check your connection and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
