# Ruff configuration for the backend.
#
# The gate is deliberately narrow: the rules the code is already written to
# (pycodestyle errors, pyflakes, import sorting) rather than every rule ruff
# knows. A lint job that fails on 200 pre-existing style opinions gets ignored;
# this one fails when something is actually wrong or an import is unused.
#
# `E501` (line length) is off because the codebase wraps for readability, not
# for a column limit, and the templates/comments routinely run past 88.

target-version = "py312"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
